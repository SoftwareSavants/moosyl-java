openapi: 3.0.3
info:
  description: "The Moosyl API is a powerful API for integrating payment solutions\
    \ with Mauritania's popular banking apps, such as Bankily, Sedad, and Masrivi.\
    \ Simplify the payment process in your Flutter applications with features like\
    \ webhooks and an easy-to-use client SDKs."
  title: Moosyl API
  version: 1.0.0
servers:
- url: /
security:
- ApiKey: []
paths:
  /cron/expire-subscriptions:
    post:
      operationId: postCronExpire-subscriptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cron.result"
          description: Response for status 200
      summary: Process due cancellations and expirations
      tags:
      - cron
      x-accepts:
      - application/json
  /cron/billing-cycle:
    post:
      operationId: postCronBilling-cycle
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cron.result"
          description: Response for status 200
      summary: Process billing cycles
      tags:
      - cron
      x-accepts:
      - application/json
  /connect/exchange:
    post:
      description: "Exchange a short-lived authorization code (obtained from the /connect\
        \ flow) for API keys dedicated to this connection, a webhook secret, and the\
        \ connection ID used to revoke it. Connecting again replaces the keys and\
        \ updates the same webhook."
      operationId: postConnectExchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postConnectExchange_request"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postConnectExchange_request"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postConnectExchange_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postConnectExchange_200_response"
          description: Response for status 200
      summary: Exchange authorization code for API credentials
      tags:
      - connect
      x-content-type: application/json
      x-accepts:
      - application/json
  /connect/revoke:
    delete:
      description: "Revoke a connection between a platform and a Moosyl account. Deletes\
        \ the connection's API keys and webhook, so the platform loses access immediately."
      operationId: deleteConnectRevoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postConnectRevoke_200_response"
          description: Response for status 200
      summary: Revoke a platform connection
      tags:
      - connect
      x-content-type: application/json
      x-accepts:
      - application/json
    post:
      description: "Revoke a connection between a platform and a Moosyl account. Deletes\
        \ the connection's API keys and webhook, so the platform loses access immediately."
      operationId: postConnectRevoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postConnectRevoke_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postConnectRevoke_200_response"
          description: Response for status 200
      summary: Revoke a platform connection (POST)
      tags:
      - connect
      x-content-type: application/json
      x-accepts:
      - application/json
  /configuration:
    get:
      description: Retrieve all configurations for the current environment
      operationId: getConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/configuration.list"
          description: Response for status 200
      summary: List configurations
      tags:
      - configuration
      x-accepts:
      - application/json
  /configuration/{id}:
    get:
      description: Retrieve a specific configuration by ID. Requires secret API key.
      operationId: getConfigurationById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/configuration.get"
          description: Response for status 200
      summary: Get configuration
      tags:
      - configuration
      x-accepts:
      - application/json
  /payment-request/{id}:
    get:
      description: Retrieve a payment request by ID
      operationId: getPayment-requestById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/paymentRequest.get"
          description: Response for status 200
      summary: Get payment request
      tags:
      - payment-request
      x-accepts:
      - application/json
  /payment-request/by-transaction/{transactionId}:
    get:
      description: Retrieve a payment request by transaction ID
      operationId: getPayment-requestBy-transactionByTransactionId
      parameters:
      - explode: false
        in: path
        name: transactionId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/paymentRequest.get"
          description: Response for status 200
      summary: Get payment request by transaction ID
      tags:
      - payment-request
      x-accepts:
      - application/json
  /payment-request:
    post:
      description: Create a new payment request that can be used to collect payments.
        Requires secret API key.
      operationId: postPayment-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/paymentRequest.create"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/paymentRequest.create"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/paymentRequest.create"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/paymentRequest.get"
          description: Response for status 200
      summary: Create payment request
      tags:
      - payment-request
      x-content-type: application/json
      x-accepts:
      - application/json
  /payment-request/{transactionId}/refresh-status:
    patch:
      description: Refresh the status of a payment request by transaction ID. Requires
        secret API key.
      operationId: patchPayment-requestByTransactionIdRefresh-status
      parameters:
      - explode: false
        in: path
        name: transactionId
        required: true
        schema:
          description: The transaction ID of the payment request to refresh
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/paymentRequest.refreshStatus"
          description: Response for status 200
      summary: Refresh payment request status
      tags:
      - payment-request
      x-accepts:
      - application/json
  /payment:
    post:
      description: |-
        Use this endpoint to create a new payment for an existing payment request.

        **Testing (Sandbox Environment Only) — native methods only**

        The magic phone numbers below only apply to native payment methods (e.g. Sedad,
        NexConnect, native Bankily). They do not apply to Gimtel methods — see below.

        | Phone Number | Status     |
        |--------------|------------|
        | 22222222     | Accepted   |
        | 33333333     | Accepted   |
        | 44444444     | Accepted   |
        | Other        | Rejected   |

        **Gimtel methods (Bankily via Gimtel, BCI Pay, Amanty)**

        The payment is created as `pending` and the response includes `instructions`
        (receiving phone, exact amount). The payer transfers from the phone number you
        sent. Poll `GET /payment/{paymentId}/status` every few seconds while the payer
        is on the payment screen — the payment stops being claimable about 10 minutes
        after the last poll. Completion also fires the `payment-updated` webhook.

        In sandbox, Gimtel methods are never completed by a magic phone number: call
        `POST /payment/{paymentId}/simulate-transfer` instead to simulate the payer's
        bank transfer and complete the payment.
      operationId: postPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/payment.create"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/payment.create"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/payment.create"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postPayment_200_response"
          description: Response for status 200
      summary: Create a new payment
      tags:
      - payment
      x-content-type: application/json
      x-accepts:
      - application/json
  /payment/{id}/status:
    get:
      description: "Returns the payment's status. For Gimtel payments, poll this every\
        \ few seconds while the payer is on the payment screen: the payment stops\
        \ being claimable about 10 minutes after the last poll."
      operationId: getPaymentByIdStatus
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getPaymentByIdStatus_200_response"
          description: Response for status 200
      summary: Get payment status (heartbeat)
      tags:
      - payment
      x-accepts:
      - application/json
  /payment/{id}/simulate-transfer:
    post:
      description: Sandbox only. Completes a pending Gimtel payment as if the payer
        had transferred the exact amount.
      operationId: postPaymentByIdSimulate-transfer
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postPaymentByIdSimulate_transfer_200_response"
          description: Response for status 200
      summary: Simulate a Gimtel transfer (sandbox)
      tags:
      - payment
      x-accepts:
      - application/json
  /payment/{id}:
    get:
      description: Retrieve detailed information about a payment by transaction ID.
        Requires secret API key.
      operationId: getPaymentById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payment.get"
          description: Response for status 200
      summary: Get payment details
      tags:
      - payment
      x-accepts:
      - application/json
  /checkout-session:
    post:
      description: "Create a hosted checkout session from paymentRequestId, or from\
        \ transactionId (optionally creating the payment request when amount is provided)."
      operationId: postCheckout-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checkoutSession.createBody"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/checkoutSession.createBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/checkoutSession.createBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkoutSession.create"
          description: Response for status 200
      summary: Create checkout session
      tags:
      - checkout-session
      x-content-type: application/json
      x-accepts:
      - application/json
  /checkout-session/public/{id}:
    get:
      description: Get checkout session details without an API key.
      operationId: getCheckout-sessionPublicById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkoutSession.get"
          description: Response for status 200
      security: []
      summary: Get public checkout session
      tags:
      - checkout-session
      x-accepts:
      - application/json
  /checkout-session/public/{id}/switch-method:
    post:
      description: Switch checkout method and cancel the latest pending payment when
        present.
      operationId: postCheckout-sessionPublicByIdSwitch-method
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checkoutSession.selectMethod.body"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/checkoutSession.selectMethod.body"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/checkoutSession.selectMethod.body"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkoutSession.switchMethod"
          description: Response for status 200
      security: []
      summary: Switch public checkout method
      tags:
      - checkout-session
      x-content-type: application/json
      x-accepts:
      - application/json
  /checkout-session/public/{id}/pay:
    post:
      description: Create payment for a checkout session without requiring API key
        in the client.
      operationId: postCheckout-sessionPublicByIdPay
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checkoutSession.pay.body"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/checkoutSession.pay.body"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/checkoutSession.pay.body"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postCheckout_sessionPublicByIdPay_200_response"
          description: Response for status 200
      security: []
      summary: Pay public checkout session
      tags:
      - checkout-session
      x-content-type: application/json
      x-accepts:
      - application/json
  /checkout-session/public/{id}/payment-status:
    get:
      description: "Heartbeat for the hosted checkout: keeps the payment claimable\
        \ while the payer is on the page and returns its status."
      operationId: getCheckout-sessionPublicByIdPayment-status
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: paymentId
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCheckout_sessionPublicByIdPayment_status_200_response"
          description: Response for status 200
      security: []
      summary: Poll a Gimtel checkout payment
      tags:
      - checkout-session
      x-accepts:
      - application/json
  /checkout-session/public/{id}/simulate-transfer:
    post:
      description: Sandbox only. Completes the pending Gimtel payment as if the payer
        had transferred the exact amount.
      operationId: postCheckout-sessionPublicByIdSimulate-transfer
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postCheckout_sessionPublicByIdSimulate_transfer_request"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postCheckout_sessionPublicByIdSimulate_transfer_request"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postCheckout_sessionPublicByIdSimulate_transfer_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCheckout_sessionPublicByIdPayment_status_200_response"
          description: Response for status 200
      security: []
      summary: Simulate a Gimtel transfer (sandbox)
      tags:
      - checkout-session
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/:
    get:
      operationId: getProducts
      parameters:
      - explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          $ref: "#/components/schemas/getProducts_page_parameter"
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          $ref: "#/components/schemas/getProducts_page_parameter"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product.list"
          description: Response for status 200
      summary: List products or filter by id
      tags:
      - products
      x-accepts:
      - application/json
    post:
      operationId: postProducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/product.create"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/product.create"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/product.create"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product.get"
          description: Response for status 200
      summary: Create product
      tags:
      - products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{id}:
    get:
      operationId: getProductsById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product.getWithPrices"
          description: Response for status 200
      summary: Get product with prices
      tags:
      - products
      x-accepts:
      - application/json
    patch:
      operationId: patchProductsById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/product.update"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/product.update"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/product.update"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product.get"
          description: Response for status 200
      summary: Update product
      tags:
      - products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{id}/archive:
    patch:
      operationId: patchProductsByIdArchive
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
          description: Response for status 200
      summary: Archive product
      tags:
      - products
      x-accepts:
      - application/json
  /prices/{id}:
    get:
      operationId: getPricesById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/price.get"
          description: Response for status 200
      summary: Get price
      tags:
      - prices
      x-accepts:
      - application/json
    patch:
      operationId: patchPricesById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/price.update"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/price.update"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/price.update"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/price.get"
          description: Response for status 200
      summary: Update price
      tags:
      - prices
      x-content-type: application/json
      x-accepts:
      - application/json
  /prices/:
    post:
      operationId: postPrices
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/price.create"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/price.create"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/price.create"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/price.get"
          description: Response for status 200
      summary: Create price
      tags:
      - prices
      x-content-type: application/json
      x-accepts:
      - application/json
  /prices/{id}/archive:
    patch:
      operationId: patchPricesByIdArchive
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/success"
          description: Response for status 200
      summary: Archive price
      tags:
      - prices
      x-accepts:
      - application/json
  /customers/:
    get:
      operationId: getCustomers
      parameters:
      - explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: externalUserId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          $ref: "#/components/schemas/getProducts_page_parameter"
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          $ref: "#/components/schemas/getProducts_page_parameter"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/customer.list"
          description: Response for status 200
      summary: List customers or filter by id/external user
      tags:
      - customers
      x-accepts:
      - application/json
    post:
      operationId: postCustomers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/customer.create"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/customer.create"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/customer.create"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/customer.get"
          description: Response for status 200
      summary: Create customer
      tags:
      - customers
      x-content-type: application/json
      x-accepts:
      - application/json
  /customers/{id}:
    patch:
      operationId: patchCustomersById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/customer.update"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/customer.update"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/customer.update"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/customer.get"
          description: Response for status 200
      summary: Update customer
      tags:
      - customers
      x-content-type: application/json
      x-accepts:
      - application/json
  /subscriptions/:
    get:
      operationId: getSubscriptions
      parameters:
      - explode: true
        in: query
